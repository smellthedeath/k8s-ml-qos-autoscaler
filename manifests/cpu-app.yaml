apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-app
  namespace: thesis-exp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-app
  template:
    metadata:
      labels:
        app: cpu-app
    spec:
      containers:
      - name: cpu-app
        image: thesis-cpu-app:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cpu-app
  namespace: thesis-exp
spec:
  selector:
    app: cpu-app
  ports:
  - port: 80
    targetPort: 8080
